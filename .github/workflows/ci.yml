name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/version.sh check

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
      - run: php php/tests/run.php

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet run --project dotnet/MercadoPublico.Tests -f net8.0
      - run: dotnet run --project dotnet/MercadoPublico.Tests -f net10.0

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Ejercita lo que usa la publicación (release.yml), que no corre en los pull requests: así un cambio de
  # Dependabot en pack, upload/download-artifact o setup-dotnet se detecta ANTES de una etiqueta.
  empaquetado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet pack dotnet/MercadoPublico/MercadoPublico.csproj -c Release -o paquetes
      - uses: actions/upload-artifact@v7
        with:
          name: paquetes-ci
          path: paquetes/*
      - uses: actions/download-artifact@v8
        with:
          name: paquetes-ci
          path: descargado
      - name: El paquete descargado debe ser el construido
        run: |
          ls -l descargado
          test -f descargado/MercadoPublico.*.nupkg
          test -f descargado/MercadoPublico.*.snupkg
      - uses: dtolnay/rust-toolchain@stable
      - name: Empaquetar el crate (como lo haría cargo publish)
        run: cargo package --manifest-path rust/Cargo.toml
      - name: Validar composer.json
        run: composer validate --strict
